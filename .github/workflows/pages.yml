name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 取出仓库文件
        uses: actions/checkout@v4

      - name: 准备 Pages（如果没开启就自动开启）
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 打包静态文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
